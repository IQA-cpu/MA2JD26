document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:'Schibsted Grotesk';font-weight:700;font-size:18px;line-height:1.3;color:#16293f;\">Raising Finance From A Bank<\u002Fh4>\n          <ul data-topics=\"\" style=\"display:grid;gap:7px;margin-top:2px;\">\n            <li style=\"list-style:none;padding-left:16px;position:relative;font-size:13.5px;line-height:1.5;color:#4a5560;\"><span style=\"position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--accent);\"><\u002Fspan>Short- vs long-term finance<\u002Fli>\n            <li style=\"list-style:none;padding-left:16px;position:relative;font-size:13.5px;line-height:1.5;color:#4a5560;\"><span style=\"position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--accent);\"><\u002Fspan>Overdrafts &amp; bank loans<\u002Fli>\n            <li style=\"list-style:none;padding-left:16px;position:relative;font-size:13.5px;line-height:1.5;color:#4a5560;\"><span style=\"position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--accent);\"><\u002Fspan>Security &amp; covenants<\u002Fli>\n            <li style=\"list-style:none;padding-left:16px;position:relative;font-size:13.5px;line-height:1.5;color:#4a5560;\"><br><\u002Fli>\n          <\u002Ful>\n                    <div style=\"margin-top:auto;padding-top:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;\">\n            <button data-open-lesson=\"22\" type=\"button\" style=\"display:inline-flex;align-items:center;gap:7px;border:none;background:#16293f;color:#f5f4ef;font-family:'Schibsted Grotesk';font-size:13px;font-weight:700;padding:9px 15px;border-radius:999px;cursor:pointer;transition:background .15s;\" style-hover=\"background:var(--accent-deep);\">Open lesson →<\u002Fbutton>\n            <button data-studied-toggle=\"22\" type=\"button\" style=\"display:inline-flex;align-items:center;gap:8px;border:1px solid #d6d1c4;background:#fff;color:#6b7480;font-family:'Public Sans';font-size:12.5px;font-weight:600;padding:7px 13px;border- x;align-items:start;\">\n\n        <!-- Part A -->\n        <details class=\"fx\" style=\"background:#fff;border:1px solid #e4e0d6;border-radius:16px;overflow:hidden;\">\n          <summary style=\"padding:16px 22px;background:var(--accent-soft);display:flex;align-items:center;gap:11px;cursor:pointer;\">\n            <span style=\"font-family:'Schibsted Grotesk';font-weight:800;font-size:11.5px;letter-spacing:.1em;color:var(--accent-deep);border:1px solid #e0d3b6;background:#fff;padding:4px 9px;border-radius:6px;\">PART A<\u002Fspan>\n            <h3 style=\"margin:0;font-family:'Schibsted Grotesk';font-weight:700;font-size:17px;color:#16293f;\">Management Information<\u002Fh3>\n            <span class=\"fx-chev\" style=\"margin-left:auto;color:var(--accent-deep);font-size:14px;transition:transform .2s;\">▶<\u002Fspan>\n          <\u002Fsummary>\n          <div style=\"padding:6px 22px 18px;\">\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">High–low method: variable cost per unit<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">(Cost at high level − Cost at low level) ÷ (Units at high − Units at low)<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Total cost (cost equation)<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">Fixed cost + (Variable cost per unit × Activity level)<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Percentage variance<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">(Actual − Budget) ÷ Budget × 100<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n        <!-- Part B -->\n        <details class=\"fx\" style=\"background:#fff;border:1px solid #e4e0d6;border-radius:16px;overflow:hidden;\">\n          <summary style=\"padding:16px 22px;background:var(--accent-soft);display:flex;align-items:center;gap:11px;cursor:pointer;\">\n            <span style=\"font-family:'Schibsted Grotesk';font-weight:800;font-size:11.5px;letter-spacing:.1em;color:var(--accent-deep);border:1px solid #e0d3b6;background:#fff;padding:4px 9px;border-radius:6px;\">PART B<\u002Fspan>\n            <h3 style=\"margin:0;font-family:'Schibsted Grotesk';font-weight:700;font-size:17px;color:#16293f;\">Cost Recording<\u002Fh3>\n            <span class=\"fx-chev\" style=\"margin-left:auto;color:var(--accent-deep);font-size:14px;transition:transform .2s;\">▶<\u002Fspan>\n          <\u002Fsummary>\n          <div style=\"padding:6px 22px 18px;\">\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Economic order quantity (EOQ)<\u002Fp>\n              <p style=\"margin:0 0 6px;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">√( 2 × C<sub>o<\u002Fsub> × D ÷ C<sub>h<\u002Fsub> )<\u002Fp>\n              <p style=\"margin:0;font-size:12px;line-height:1.5;color:#8a8678;\">C<sub>o<\u002Fsub> = cost per order · D = annual demand · C<sub>h<\u002Fsub> = holding cost per unit per year<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Reorder level<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">Maximum usage × Maximum lead time<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Minimum inventory level<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">Reorder level − (Average usage × Average lead time)<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Maximum inventory level<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">Reorder level + Reorder qty − (Minimum usage × Minimum lead time)<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Labour turnover rate<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">(Replacements ÷ Average number of employees) × 100<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Labour efficiency ratio<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">(Expected hours for output ÷ Actual hours worked) × 100<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Capacity ratio<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">(Actual hours worked ÷ Budgeted hours) × 100<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Production volume (activity) ratio<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">(Expected hours for output ÷ Budgeted hours) × 100<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Idle time ratio<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">(Idle hours ÷ Total hours) × 100<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n        <!-- Part C -->\n        <details class=\"fx\" style=\"background:#fff;border:1px solid #e4e0d6;border-radius:16px;overflow:hidden;\">\n          <summary style=\"padding:16px 22px;background:var(--accent-soft);display:flex;align-items:center;gap:11px;cursor:pointer;\">\n            <span style=\"font-family:'Schibsted Grotesk';font-weight:800;font-size:11.5px;letter-spacing:.1em;color:var(--accent-deep);border:1px solid #e0d3b6;background:#fff;padding:4px 9px;border-radius:6px;\">PART C<\u002Fspan>\n            <h3 style=\"margin:0;font-family:'Schibsted Grotesk';font-weight:700;font-size:17px;color:#16293f;\">Costing Techniques<\u002Fh3>\n            <span class=\"fx-chev\" style=\"margin-left:auto;color:var(--accent-deep);font-size:14px;transition:transform .2s;\">▶<\u002Fspan>\n          <\u002Fsummary>\n          <div style=\"padding:6px 22px 18px;\">\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Overhead absorption rate (OAR)<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">Budgeted overheads ÷ Budgeted activity level<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Over / (under) absorption<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">Overhead absorbed − Overhead actually incurred<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Contribution<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">Sales − Variable costs<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Contribution per unit<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">Selling price per unit − Variable cost per unit<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Profit (marginal costing)<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">Total contribution − Fixed costs<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Process costing: cost per equivalent unit<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">Total costs ÷ Total equivalent units<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Batch costing: cost per unit<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">Total batch cost ÷ Number of units in batch<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n        <!-- Part D -->\n        <details class=\"fx\" style=\"background:#fff;border:1px solid #e4e0d6;border-radius:16px;overflow:hidden;\">\n          <summary style=\"padding:16px 22px;background:var(--accent-soft);display:flex;align-items:center;gap:11px;cursor:pointer;\">\n            <span style=\"font-family:'Schibsted Grotesk';font-weight:800;font-size:11.5px;letter-spacing:.1em;color:var(--accent-deep);border:1px solid #e0d3b6;background:#fff;padding:4px 9px;border-radius:6px;\">PART D<\u002Fspan>\n            <h3 style=\"margin:0;font-family:'Schibsted Grotesk';font-weight:700;font-size:17px;color:#16293f;\">Decision Making<\u002Fh3>\n            <span class=\"fx-chev\" style=\"margin-left:auto;color:var(--accent-deep);font-size:14px;transition:transform .2s;\">▶<\u002Fspan>\n          <\u002Fsummary>\n          <div style=\"padding:6px 22px 18px;\">\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Contribution to sales (C/S) ratio<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">(Contribution ÷ Sales) × 100<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Breakeven point (units)<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">Fixed costs ÷ Contribution per unit<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Breakeven point (revenue)<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">Fixed costs ÷ C/S ratio<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Units for target profit<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">(Fixed costs + Target profit) ÷ Contribution per unit<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Margin of safety (%)<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">(Budgeted sales − Breakeven sales) ÷ Budgeted sales × 100<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Accounting rate of return (ARR)<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">(Average annual profit ÷ Average investment) × 100<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Average investment<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">(Initial investment + Residual value) ÷ 2<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Discount factor / present value<\u002Fp>\n              <p style=\"margin:0 0 6px;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">DF = 1 ÷ (1 + r)<sup>n<\u002Fsup>&nbsp;&nbsp;·&nbsp;&nbsp;PV = Cash flow × DF<\u002Fp>\n              <p style=\"margin:0;font-size:12px;line-height:1.5;color:#8a8678;\">r = discount rate · n = number of periods<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Net present value (NPV)<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">Present value of inflows − Initial investment<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n        <!-- Part E -->\n        <details class=\"fx\" style=\"background:#fff;border:1px solid #e4e0d6;border-radius:16px;overflow:hidden;\">\n          <summary style=\"padding:16px 22px;background:var(--accent-soft);display:flex;align-items:center;gap:11px;cursor:pointer;\">\n            <span style=\"font-family:'Schibsted Grotesk';font-weight:800;font-size:11.5px;letter-spacing:.1em;color:var(--accent-deep);border:1px solid #e0d3b6;background:#fff;padding:4px 9px;border-radius:6px;\">PART E<\u002Fspan>\n            <h3 style=\"margin:0;font-family:'Schibsted Grotesk';font-weight:700;font-size:17px;color:#16293f;\">Cash Management<\u002Fh3>\n            <span class=\"fx-chev\" style=\"margin-left:auto;color:var(--accent-deep);font-size:14px;transition:transform .2s;\">▶<\u002Fspan>\n          <\u002Fsummary>\n          <div style=\"padding:6px 22px 18px;\">\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Simple interest<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">Principal × Rate × Number of periods<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Compound interest (future value)<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">Principal × (1 + r)<sup>n<\u002Fsup><\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Cash operating cycle<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">Inventory days + Receivables days − Payables days<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Inventory holding period<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">(Average inventory ÷ Cost of sales) × 365<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Receivables collection period<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">(Receivables ÷ Credit sales) × 365<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Payables payment period<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">(Payables ÷ Credit purchases) × 365<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;border-bottom:1px solid #f0eee6;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Closing cash balance<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">Opening balance + Receipts − Payments<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding:14px 0;\">\n              <p style=\"margin:0 0 8px;font-family:'Schibsted Grotesk';font-weight:600;font-size:14px;color:#16293f;\">Expected value (EV)<\u002Fp>\n              <p style=\"margin:0;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:13.5px;line-height:1.55;color:var(--accent-deep);background:#f5f4ef;border-radius:9px;padding:10px 13px;\">Σ ( Probability × Outcome )<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ Q & A ============ -->\n  <section id=\"qa\" data-screen-label=\"Q &amp; A\" style=\"scroll-margin-top:74px;padding:clamp(56px,8vw,100px) 0;background:#f5f4ef;\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:0 clamp(18px,5vw,48px);\">\n      <p style=\"margin:0 0 12px;font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-deep);\">Section 04<\u002Fp>\n      <h2 style=\"margin:0 0 14px;font-family:'Schibsted Grotesk';font-weight:700;font-size:clamp(28px,4vw,44px);letter-spacing:-0.02em;color:#16293f;\">Q &amp; A<\u002Fh2>\n      <p style=\"margin:0 0 30px;max-width:64ch;font-size:16px;line-height:1.7;color:#4a5560;\">Post your questions about any chapter, exercise or exam topic on the shared board below — and answer your classmates'. It updates live, so check back for replies. You can also <a href=\"https://padlet.com/kprofessor1/q-a-n5glg8pwf00y9ihl\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent-deep);font-weight:600;text-decoration:underline;\">open the board in a new tab<\u002Fa>.<\u002Fp>\n\n      <div style=\"border:1px solid #e4e0d6;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 12px 34px rgba(22,41,63,0.07);\">\n        <iframe src=\"https://padlet.com/kprofessor1/q-a-n5glg8pwf00y9ihl\" title=\"MA2 Q &amp; A board\" frameborder=\"0\" allow=\"camera;microphone;geolocation\" style=\"width:100%;height:min(720px,80vh);display:block;border:none;\"><\u002Fiframe>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ LESSON MODAL ============ -->\n  <div data-modal=\"\" style=\"display:none;position:fixed;inset:0;z-index:100;\">\n    <div data-modal-close-bg=\"\" style=\"position:absolute;inset:0;background:rgba(22,41,63,0.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:clamp(8px,3vw,40px);pointer-events:none;\">\n      <div style=\"pointer-events:auto;background:#f5f4ef;border-radius:18px;width:min(880px,100%);height:min(720px,94vh);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.32);\">\n        <div style=\"display:flex;align-items:flex-start;gap:14px;padding:20px 24px;border-bottom:1px solid #e4e0d6;backgr rent;margin-bottom:-1px;white-space:nowrap;\">Formulas<\u002Fbutton>\n          <button data-modal-tab=\"slides\" type=\"button\" style=\"padding:12px 16px;border:none;background:none;font-family:'Public Sans';font-size:14px;font-weight:600;color:#6b7480;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;\">Slides<\u002Fbutton>\n          <button data-modal-tab=\"flashcards\" type=\"button\" style=\"padding:12px 16px;border:none;background:none;font-family:'Public Sans';font-size:14px;font-weight:600;color:#6b7480;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;\">Flashcards<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"flex:1;overflow:hidden;position:relative;\">\n          <div data-panel=\"summary\" style=\"position:absolute;inset:0;overflow-y:auto;padding:24px 26px;\"><\u002Fdiv>\n          <div data-panel=\"note\" style=\"position:absolute;inset:0;overflow-y:auto;padding:24px 26px;display:none;\"><\u002Fdiv>\n          <div data-panel=\"formulas\" style=\"position:absolute;inset:0;overflow-y:auto;padding:24px 26px;display:none;\"><\u002Fdiv>\n          <div data-panel=\"slides\" style=\"position:absolute;inset:0;overflow-y:auto;padding:24px 26px;display:none;\"><\u002Fdiv>\n          <div data-panel=\"flashcards\" style=\"position:absolute;inset:0;overflow-y:auto;padding:24px 26px;display:none;\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ FOOTER ============ -->\n  <footer style=\"background:#16293f;color:#cdd5dd;\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:clamp(44px,6vw,68px) clamp(18px,5vw,48px) 28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:36px;\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px;\"><span style=\"background:var(--accent);color:#16293f;font-family:'Schibsted Grotesk';font-weight:700;font-size:12px;padding:6px 9px;border-radius:6px;\">ACCT 221<\u002Fspan><span style=\"font-family:'Schibsted Grotesk';font-weight:700;font-size:15px;color:#f5f4ef;\">Management Accounting 1<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#9fb0c0;max-width:34ch;\">Second-year Foundations in Accountancy. Costing, decision-making and cash management for internal reporting.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <p style=\"margin:0 0 14px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7e90a2;\">Navigate<\u002Fp>\n        <div style=\"display:grid;gap:9px;\">\n          <a href=\"index.html\" style=\"text-decoration:none;color:#cdd5dd;font-size:14px;transition:color .15s;\" style-hover=\"color:var(--accent);\">Home<\u002Fa>\n          <a href=\"syllabus.html\" style=\"text-decoration:none;color:#cdd5dd;font-size:14px;transition:color .15s;\" style-hover=\"color:var(--accent);\">Syllabus &amp; Schedule<\u002Fa>\n          <a href=\"study-hub.html\" style=\"text-decoration:none;color:#cdd5dd;font-size:14px;transition:color .15s;\" style-hover=\"color:var(--accent);\">Study Reference Hub<\u002Fa>\n          <a href=\"about-lecturer.html\" style=\"text-decoration:none;color:#cdd5dd;font-size:14px;transition:color .15s;\" style-hover=\"color:var(--accent);\">About the Lecturer<\u002Fa>\n          <a href=\"student.html\" style=\"text-decoration:none;color:#cdd5dd;font-size:14px;transition:color .15s;\" style-hover=\"color:var(--accent);\">Student Zone<\u002Fa>\n          <a href=\"active-learning.html\" style=\"text-decoration:none;color:#cdd5dd;font-size:14px;transition:color .15s;\" style-hover=\"color:var(--accent);\">Active Learning<\u002Fa>\n          <a href=\"ma2-chatbot.html\" style=\"text-decoration:none;color:#cdd5dd;font-size:14px;transition:color .15s;\" style-hover=\"color:var(--accent);\">MA2 Chatbot<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <p style=\"margin:0 0 14px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7e90a2;\">Contact<\u002Fp>\n        <div style=\"display:grid;gap:9px;font-size:14px;line-height:1.5;\">\n          <span style=\"color:#f5f4ef;font-weight:600;\">Mean Udam, MSc, ACCA<\u002Fspan>\n          <a href=\"mailto:mudam@cam-ed.com\" style=\"text-decoration:none;color:var(--accent);font-weight:600;transition:color .15s;\" style-hover=\"color:#c79e5b;\">mudam@cam-ed.com<\u002Fa>\n          <span style=\"color:#9fb0c0;\">CamEd Business School<\u002Fspan>\n          <span style=\"color:#9fb0c0;\">Term: July – December 2026<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(255,255,255,0.1);\">\n      <div style=\"max-width:1180px;margin:0 auto;padding:18px clamp(18px,5vw,48px);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:12.5px;color:#7e90a2;\">\n        <span>© 2026 Management Accounting 1 · ACCT 221<\u002Fspan>\n        <span>Course hub · syllabus · study reference<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#b08d4f&quot;,&quot;options&quot;:[&quot;#b08d4f&quot;,&quot;#1f7a6d&quot;,&quot;#8c2f39&quot;,&quot;#3a6ea5&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;showPageNumbers&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;showTopics&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  state = { activeSection: 'study' };\n\n  componentDidMount() {\n    this.filter = 'all';\n    this.query = '';\n    this.chats = {};\n    this.answered = {};\n    this.modalTab = 'summary';\n    this.loadProgress();\n    this.applyTweaks();\n    this.paintNav();\n    this.wireUp();\n    this.paintFilter();\n    this.paintStudied();\n    document.addEventListener('keydown', (e) => {\n      if (e.key === 'Escape' && this.rootEl) {\n        const m = this.rootEl.querySelector('[data-modal]');\n        if (m && m.style.display !== 'none') this.closeModal();\n      }\n    });\n    const ids = ['home', 'syllabus', 'study', 'tools', 'portfolio'];\n    this.io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => { if (e.isIntersecting) this.setState({ activeSection: e.target.id }); });\n    }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });\n    if (this.rootEl) ids.forEach((id) => { const el = this.rootEl.querySelector('#' + id); if (el) this.io.observe(el); });\n  }\n\n  componentDidUpdate() {\n    this.applyTweaks();\n    this.paintNav();\n    this.paintFilter();\n    this.paintStudied();\n    const inp = this.rootEl && this.rootEl.querySelector('[data-search-input]');\n    if (inp && inp.value !== this.query) inp.value = this.query;\n  }\n\n  componentWillUnmount() { if (this.io) this.io.disconnect(); }\n\n  root() { return this.rootEl; }\n  modalPanel(t) { return this.rootEl.querySelector('[data-panel=\"' + t + '\"]'); }\n\n  esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;'); }\n\n  fmt(t) {\n    const lines = this.esc(t).replace(/\\*\\*(.+?)\\*\\*/g, '<strong>$1<\u002Fstrong>').split(/\\n/);\n    let html = '', inList = false;\n    for (const ln of lines) {\n      const h = ln.match(/^\\s*(#{1,6})\\s+(.*)/);\n      if (h) {\n        if (inList) { html += '<\u002Ful>'; inList = false; }\n        html += '<p style=\"margin:12px 0 6px;font-family:\\'Schibsted Grotesk\\';font-weight:700;font-size:14.5px;color:#16293f;\">' + h[2] + '<\u002Fp>';\n        continue;\n      }\n      const m = ln.match(/^\\s*[-•]\\s+(.*)/);\n      if (m) {\n        if (!inList) { html += '<ul style=\"margin:6px 0;padding-left:18px;display:grid;gap:4px;\">'; inList = true; }\n        html += '<li style=\"font-size:14px;line-height:1.55;\">' + m[1] + '<\u002Fli>';\n      } else {\n        if (inList) { html += '<\u002Ful>'; inList = false; }\n        if (ln.trim() === '') continue;\n        html += '<p style=\"margin:0 0 9px;font-size:14px;line-height:1.6;\">' + ln + '<\u002Fp>';\n      }\n    }\n    if (inList) html += '<\u002Ful>';\n    return html;\n  }\n\n  cleanJ(raw) {\n    let s = String(raw || '').split(String.fromCharCode(96)).join('').trim();\n    if (s.slice(0, 4).toLowerCase() === 'json') s = s.slice(4).trim();\n    return s;\n  }\n  parseJson(raw) { try { const s = this.cleanJ(raw); return JSON.parse(s.slice(s.indexOf('{'), s.lastIndexOf('}') + 1)); } catch (e) { return null; } }\n  parseArr(raw) { try { const s = this.cleanJ(raw); return JSON.parse(s.slice(s.indexOf('['), s.lastIndexOf(']') + 1)); } catch (e) { return null; } }\n\n  lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }\n  lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }\n  lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }\n  loadChat(n) { try { this.chats[n] = JSON.parse(localStorage.getItem('ma2-ch-chat-' + n)) || []; } catch (e) { this.chats[n] = []; } }\n  saveChat(n) { try { localStorage.setItem('ma2-ch-chat-' + n, JSON.stringify(this.chats[n] || [])); } catch (e) {} }\n\n  aiReady() { return !!(window.claude && window.claude.complete); }\n  aiUnavailable() { return '<div style=\"text-align:center;padding:46px 20px;color:#8a8678;\"><p style=\"margin:0;font-size:14.5px;line-height:1.6;\">These are generated live by AI — open this page in the interactive preview to use the summary, practice questions and tutor.<\u002Fp><\u002Fdiv>'; }\n  loadingBlock(msg) { return '<div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:60px 20px;text-align:center;\"><span style=\"width:26px;height:26px;border:3px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:ma2spin .8s linear infinite;\"><\u002Fspan><p style=\"margin:0;color:#8a8678;font-size:14px;\">' + msg + '<\u002Fp><\u002Fdiv>'; }\n  errorBlock(msg, which) { return '<div style=\"text-align:center;padding:50px 20px;color:#8a8678;\"><p style=\"margin:0 0 14px;font-size:14.5px;\">' + msg + '<\u002Fp><button data-regen=\"' + which + '\" type=\"button\" style=\"border:1px solid #d6d1c4;background:#fff;color:#16293f;font-family:\\'Public Sans\\';font-size:13.5px;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer;\">Try again<\u002Fbutton><\u002Fdiv>'; }\n  regenLink(which) { return '<div style=\"margin-top:18px;text-align:center;\"><button data-regen=\"' + which + '\" type=\"button\" style=\"border:none;background:none;color:#9a9686;font-size:12.5px;font-weight:600;cursor:pointer;font-family:\\'Public Sans\\';text-decoration:underline;\">↻ Regenerate<\u002Fbutton><\u002Fdiv>'; }\n\n  ctx(n) {\n    const card = this.rootEl.querySelector('[data-chapter=\"' + n + '\"]');\n    return {\n      title: card.querySelector('h4').textContent.trim(),\n      topics: Array.prototype.map.call(card.querySelectorAll('[data-topics] li'), (li) => li.textContent.trim())\n    };\n  }\n\n  wireUp() {\n    if (!this.rootEl || this._wired) return;\n    this._wired = true;\n    this.rootEl.addEventListener('click', (e) => {\n      const f = e.target.closest('[data-filter]');\n      if (f) { this.filter = f.getAttribute('data-filter'); this.paintFilter(); return; }\n      const st = e.target.closest('[data-studied-toggle]');\n      if (st) { const n = st.getAttribute('data-studied-toggle'); this.studied[n] = !this.studied[n]; this.saveProgress(); this.paintStudied(); return; }\n      if (e.target.closest('[data-reset-progress]')) { this.studied = {}; this.saveProgress(); this.paintStudied(); return; }\n      if (e.target.closest('[data-clear-search]')) { this.filter = 'all'; this.query = ''; const i = this.rootEl.querySelector('[data-search-input]'); if (i) i.value = ''; this.paintFilter(); return; }\n      const ol = e.target.closest('[data-open-lesson]');\n      if (ol) { this.openLesson(+ol.getAttribute('data-open-lesson')); return; }\n      if (e.target.closest('[data-modal-close]') || e.target.closest('[data-modal-close-bg]')) { this.closeModal(); return; }\n      const mt = e.target.closest('[data-modal-tab]');\n      if (mt) { this.setModalTab(mt.getAttribute('data-modal-tab')); return; }\n      const mcq = e.target.closest('[data-mcq-opt]');\n      if (mcq) { this.gradeMcq(+mcq.getAttribute('data-mcq-q'), +mcq.getAttribute('data-mcq-opt')); return; }\n      if (e.target.closest('[data-tutor-send]')) { this.sendTutor(); return; }\n      if (e.target.closest('[data-quiz-reset]')) { if (this.quiz) this.renderQuiz(this.quiz); return; }\n      if (e.target.closest('[data-tutor-clear]')) { const n = this.current; this.chats[n] = []; this.saveChat(n); this.renderTutorMessages(n); return; }\n      const rg = e.target.closest('[data-regen]');\n      if (rg) {\n        const which = rg.getAttribute('data-regen');\n        this.lsDel('ma2-ch-' + which + '-' + this.current);\n        if (which === 'summary') this.loadSummary(this.current);\n        else { this._quizLoadedFor = null; this.loadQuiz(this.current); }\n        return;\n      }\n    });\n    const inp = this.rootEl.querySelector('[data-search-input]');\n    if (inp) inp.addEventListener('input', (e) => { this.query = e.target.value.toLowerCase().trim(); this.paintFilter(); });\n  }\n\n  openLesson(n) {\n    this.current = n;\n    const card = this.rootEl.querySelector('[data-chapter=\"' + n + '\"]');\n    const title = card.querySelector('h4').textContent.trim();\n    const page = card.querySelector('[data-page]').textContent.replace(/\\s+/g, ' ').trim();\n    this.rootEl.querySelector('[data-modal-num]').textContent = n;\n    this.rootEl.querySelector('[data-modal-title]').textContent = title;\n    this.rootEl.querySelector('[data-modal-page]').textContent = 'Chapter ' + n + ' · ' + page;\n    if (!this.chats[n]) this.loadChat(n);\n    this._quizLoadedFor = null;\n    const fBtn = this.rootEl.querySelector('[data-modal-tab=\"formulas\"]');\n    if (fBtn) fBtn.style.display = this.formulasData(n) ? '' : 'none';\n    this.rootEl.querySelector('[data-modal]').style.display = 'block';\n    document.body.style.overflow = 'hidden';\n    this.setModalTab('summary');\n    this.loadSummary(n);\n  }\n\n  closeModal() {\n    const m = this.rootEl.querySelector('[data-modal]');\n    if (m) m.style.display = 'none';\n    document.body.style.overflow = '';\n  }\n\n  paintModalTabs() {\n    this.rootEl.querySelectorAll('[data-modal-tab]').forEach((b) => {\n      const active = b.getAttribute('data-modal-tab') === this.modalTab;\n      b.style.color = active ? '#16293f' : '#6b7480';\n      b.style.borderBottomColor = active ? 'var(--accent)' : 'transparent';\n    });\n  }\n  showPanel(tab) {\n    ['summary', 'note', 'slides', 'formulas', 'flashcards'].forEach((t) => {\n      const p = this.modalPanel(t);\n      if (!p) return;\n      p.style.display = (t === tab) ? 'block' : 'none';\n    });\n  }\n  setModalTab(tab) {\n    this.modalTab = tab;\n    this.paintModalTabs();\n    this.showPanel(tab);\n    if (tab === 'note') this.loadNote(this.current);\n    if (tab === 'slides') this.loadSlides(this.current);\n    if (tab === 'formulas') this.loadFormulas(this.current);\n    if (tab === 'flashcards') this.loadFlashcards(this.current);\n  }\n\n  flashcardsUrl(n) {\n    const map = {\n      1: 'https://app.edcafe.ai/flashcards/696619acaeaf995e3fbc371f',\n      2: 'https://app.edcafe.ai/flashcards/696d7a509bdad8a5f6677935',\n      3: 'https://app.edcafe.ai/flashcards/6a46328ab5253df1c9333687',\n      4: 'https://app.edcafe.ai/flashcards/6a46331fb5253df1c9333981',\n      5: 'https://app.edcafe.ai/flashcards/697899c92f5d08069e06e9f5',\n      6: 'https://app.edcafe.ai/flashcards/6a463484b5253df1c9333f9f',\n      7: 'https://app.edcafe.ai/flashcards/69a1180f6f6bd6277f218511',\n      8: 'https://app.edcafe.ai/flashcards/6a4635aeb5253df1c9334411',\n      9: 'https://app.edcafe.ai/flashcards/6a46363e9776c1ac0d1f2748',\n      10: 'https://app.edcafe.ai/flashcards/68cd3360b9f9ed8ab15f6b5e',\n      11: 'https://app.edcafe.ai/flashcards/68db55460ba2af8f0f9d7bbd',\n      12: 'https://app.edcafe.ai/flashcards/6a46378eb5253df1c93349a7',\n      13: 'https://app.edcafe.ai/flashcards/6902d9f665effae6a4547cba',\n      14: 'https://app.edcafe.ai/flashcards/6901e991ea931f4c1a77a0e9',\n      15: 'https://app.edcafe.ai/flashcards/6a4638629776c1ac0d1f2b09',\n      16: 'https://app.edcafe.ai/flashcards/69157f308937c03a544a5c17',\n      17: 'https://app.edcafe.ai/flashcards/6a4639119776c1ac0d1f2df1',\n      18: 'https://app.edcafe.ai/flashcards/6a463b66b5253df1c9334efb',\n      19: 'https://app.edcafe.ai/flashcards/6a463c02b5253df1c933504f',\n      20: 'https://app.edcafe.ai/flashcards/6a463cfe9776c1ac0d1f3566',\n      21: 'https://app.edcafe.ai/flashcards/6a463e0fb5253df1c93355e5',\n      22: 'https://app.edcafe.ai/flashcards/6a463ec6b5253df1c93357fd'\n    };\n    return map[n] || null;\n  }\n\n  loadFlashcards(n) {\n    const panel = this.modalPanel('flashcards');\n    const url = this.flashcardsUrl(n);\n    const c = this.ctx(n);\n    if (!url) { panel.innerHTML = '<div style=\"text-align:center;padding:46px 20px;color:#8a8678;\"><p style=\"margin:0;font-size:14.5px;\">No flashcard set is available for this chapter yet.<\u002Fp><\u002Fdiv>'; return; }\n    panel.innerHTML =\n      '<p style=\"margin:0 0 18px;font-size:15px;line-height:1.65;color:#3a4550;\">Drill the key terms for <strong>Chapter ' + n + ' \\u00b7 ' + this.esc(c.title) + '<\u002Fstrong> with the EdCafe flashcard deck. It opens in a ne \">☰<\u002Fspan>' +\n        '<div style=\"flex:1;min-width:0;\">' +\n          '<p style=\"margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);\">EdCafe summary note<\u002Fp>' +\n          '<p style=\"margin:0;font-family:\\'Schibsted Grotesk\\';font-weight:700;font-size:18px;color:#f5f4ef;\">Chapter ' + n + ' summary note<\u002Fp>' +\n        '<\u002Fdiv>' +\n        '<span style=\"flex-shrink:0;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#16293f;font-family:\\'Schibsted Grotesk\\';font-weight:700;font-size:14px;padding:11px 18px;border-radius:999px;\">Open note →<\u002Fspan>' +\n      '<\u002Fa>';\n  }\n\n  renderSummary(d) {\n    let h = '';\n    if (d.overview) h += '<p style=\"margin:0 0 4px;font-size:15.5px;line-height:1.65;color:#3a4550;\">' + this.esc(d.overview) + '<\u002Fp>';\n    const sect = (title, items) => {\n      if (!items || !items.length) return '';\n      let s = '<p style=\"margin:20px 0 9px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8a8678;\">' + title + '<\u002Fp><ul style=\"display:grid;gap:8px;\">';\n      for (const it of items) s += '<li style=\"list-style:none;padding-left:18px;position:relative;font-size:14.5px;line-height:1.55;color:#3a4550;\"><span style=\"position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--accent);\"><\u002Fspan>' + this.esc(it) + '<\u002Fli>';\n      return s + '<\u002Ful>';\n    };\n    h += sect('Key concepts', d.concepts);\n    if (d.formulas && d.formulas.length) {\n      h += '<div style=\"margin-top:20px;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:11px;padding:14px 18px;\"><p style=\"margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-deep);\">Key formulas<\u002Fp>';\n      for (const f of d.formulas) h += '<p style=\"margin:0 0 6px;font-family:\\'Schibsted Grotesk\\';font-weight:600;font-size:15px;color:#16293f;line-height:1.4;\">' + this.esc(f) + '<\u002Fp>';\n      h += '<\u002Fdiv>';\n    }\n    h += sect('Exam tips', d.tips);\n    return h;\n  }\n\n  async loadQuiz(n) {\n    const panel = this.modalPanel('quiz');\n    const key = 'ma2-ch-quiz-' + n;\n    const cached = this.lsGet(key);\n    if (cached && cached.length) { this.renderQuiz(cached); return; }\n    if (!this.aiReady()) { panel.innerHTML = this.aiUnavailable(); return; }\n    panel.innerHTML = this.loadingBlock('Building 10 practice questions…');\n    try {\n      const c = this.ctx(n);\n      const valid = (x) => x && x.q && Array.isArray(x.options) && x.options.length === 4 && typeof x.answer === 'number' && x.answer >= 0 && x.answer <= 3;\n      const mk = (count, extra) => 'Create ' + count + ' exam-style multiple-choice questions to test MA2 \"Chapter ' + n + ': ' + c.title + '\" (topics: ' + c.topics.join('; ') + '). ' + extra + ' Respond with ONLY a JSON array (no code fences) of ' + count + ' objects with keys: \"q\" (question), \"options\" (array of exactly 4 short strings), \"answer\" (integer 0-3, index of the correct option), \"explanation\" (one short sentence). Keep questions and options concise.';\n      const res = await Promise.all([\n        window.claude.complete(mk(5, 'Focus on core definitions and principles.')),\n        window.claude.complete(mk(5, 'Focus on application, calculations and trickier distinctions; make them different from basic definition questions.'))\n      ]);\n      if (n !== this.current) return;\n      let arr = [].concat(this.parseArr(res[0]) || [], this.parseArr(res[1]) || []).filter(valid);\n      // Top up to 10 if a call returned too few / unparseable JSON.\n      let tries = 0;\n      while (arr.length < 10 && tries < 2) {\n        tries++;\n        const need = 10 - arr.length;\n        const seen = arr.map((x) => x.q).join(' | ');\n        const fill = this.parseArr(await window.claude.complete(mk(need, 'These must be DIFFERENT from these existing questions: ' + seen)));\n        if (n !== this.current) return;\n        if (fill) arr = arr.concat(fill.filter(valid));\n      }\n      arr = arr.slice(0, 10);\n      if (!arr.length) throw new Error('empty');\n      this.lsSet(key, arr);\n      this.renderQuiz(arr);\n    } catch (e) { panel.innerHTML = this.errorBlock('Could not generate questions.', 'quiz'); }\n  }\n\n  renderQuiz(arr) {\n    this.quiz = arr; this.answered = {};\n    let h = '<div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;\"><p style=\"margin:0;font-size:13.5px;color:#6b7480;\">Pick an answer for instant feedback.<\u002Fp><div style=\"display:flex;align-items:center;gap:13px;\"><span data-quiz-score style=\"font-family:\\'Schibsted Grotesk\\';font-weight:700;font-size:15px;color:#16293f;\">0 / ' + arr.length + '<\u002Fspan><button data-quiz-reset type=\"button\" style=\"border:1px solid #d6d1c4;background:#fff;color:#16293f;font-family:\\'Public Sans\\';font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:999px;cursor:pointer;\">Reset practice<\u002Fbutton><\u002Fdiv><\u002Fdiv>';\n    arr.forEach((q, qi) => {\n      h += '<div data-mcq-block=\"' + qi + '\" style=\"border:1px solid #e4e0d6;background:#fff;border-radius:13px;padding:18px 20px;margin-bottom:14px;\">';\n      h += '<p style=\"margin:0 0 13px;font-weight:600;font-size:15px;line-height:1.5;color:#16293f;\">' + (qi + 1) + '. ' + this.esc(q.q) + '<\u002Fp><div style=\"display:grid;gap:9px;\">';\n      q.options.forEach((opt, oi) => {\n        h += '<button data-mcq-q=\"' + qi + '\" data-mcq-opt=\"' + oi + '\" type=\"button\" style=\"display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 15px;border:1px solid #d6d1c4;border-radius:10px;background:#fff;color:#16293f;font-size:14px;font-weight:500;cursor:pointer;font-family:\\'Public Sans\\';transition:all .15s;\"><span>' + this.esc(opt) + '<\u002Fspan><span data-mcq-mark style=\"font-weight:700;\"><\u002Fspan><\u002Fbutton>';\n      });\n      h += '<\u002Fdiv><p data-mcq-expl style=\"display:none;margin:13px 0 0;padding:11px 14px;background:var(--accent-soft);border-radius:9px;font-size:13.5px;line-height:1.55;color:#5a4a2e;\"><\u002Fp><\u002Fdiv>';\n    });\n    h += this.regenLink('quiz');\n    this.modalPanel('quiz').innerHTML = h;\n  }\n\n  gradeMcq(qi, oi) {\n    if (this.answered[qi] != null) return;\n    this.answered[qi] = oi;\n    const q = this.quiz[qi];\n    const block = this.rootEl.querySelector('[data-mcq-block=\"' + qi + '\"]');\n    block.querySelectorAll('[data-mcq-opt]').forEach((btn, i) => {\n      const mark = btn.querySelector('[data-mcq-mark]');\n      if (i === q.answer) { btn.style.borderColor = '#1f7a55'; btn.style.background = '#e9f5ee'; btn.style.color = '#155c3f'; btn.style.fontWeight = '600'; if (mark) mark.textContent = '✓'; }\n      else if (i === oi) { btn.style.borderColor = '#c0504d'; btn.style.background = '#fbecec'; btn.style.color = '#8c2f2f'; if (mark) mark.textContent = '✕'; }\n      else { btn.style.background = '#faf9f5'; btn.style.color = '#8a8678'; btn.style.borderColor = '#ece9df'; }\n      btn.style.cursor = 'default';\n    });\n    const expl = block.querySelector('[data-mcq-expl]');\n    if (expl && q.explanation) { expl.textContent = q.explanation; expl.style.display = ''; }\n    let c = 0;\n    Object.keys(this.answered).forEach((k) => { if (this.answered[k] === this.quiz[k].answer) c++; });\n    const sc = this.rootEl.querySelector('[data-quiz-score]');\n    if (sc) sc.textContent = c + ' / ' + this.quiz.length;\n  }\n\n  renderTutorShell(n) {\n    const panel = this.modalPanel('tutor');\n    if (panel.getAttribute('data-built') !== '1') {\n      panel.setAttribute('data-built', '1');\n      panel.innerHTML = '<div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 26px;border-bottom:1px solid #ece9df;background:#fff;\"><span style=\"font-family:\\'Schibsted Grotesk\\';font-weight:700;font-size:13px;color:#16293f;\">Chat with the AI tutor<\u002Fspan><button data-tutor-clear type=\"button\" style=\"border:1px solid #d6d1c4;background:#fff;color:#6b7480;font-family:\\'Public Sans\\';font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:999px;cursor:pointer;\">Clear chat<\u002Fbutton><\u002Fdiv>' +\n        '<div data-tutor-scroll style=\"flex:1;overflow-y:auto;padding:22px 26px;display:flex;flex-direction:column;gap:13px;\"><\u002Fdiv>' +\n        '<div style=\"border-top:1px solid #e4e0d6;background:#fff;padding:13px 16px;display:flex;gap:10px;align-items:flex-end;\">' +\n        '<textarea data-tutor-input rows=\"1\" placeholder=\"Ask about this chapter…\" style=\"flex:1;resize:none;max-height:130px;border:1px solid #d6d1c4;border-radius:12px;padding:11px 14px;font-family:\\'Public Sans\\';font-size:14px;line-height:1.4;color:#16293f;outline:none;\"><\u002Ftextarea>' +\n        '<button data-tutor-send type=\"button\" style=\"flex-shrink:0;border:none;background:#16293f;color:#f5f4ef;font-family:\\'Schibsted Grotesk\\';font-weight:700;font-size:14px;padding:11px 18px;border-radius:11px;cursor:pointer;\">Send<\u002Fbutton><\u002Fdiv>';\n      const ta = panel.querySelector('[data-tutor-input]');\n      ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.sendTutor(); } });\n      ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 130) + 'px'; });\n    }\n    this.renderTutorMessages(n);\n  }\n\n  bubble(role, html, raw) {\n    const me = role === 'user';\n    return '<div style=\"display:flex;' + (me ? 'justify-content:flex-end;' : '') + '\"><div style=\"max-width:84%;padding:11px 15px;border-radius:14px;' + (me ? 'background:#16293f;color:#f5f4ef;border-bottom-right-radius:5px;' : 'background:#fff;border:1px solid #e4e0d6;color:#3a4550;border-bottom-left-radius:5px;') + 'font-size:14px;line-height:1.55;\">' + (raw ? html : (me ? this.esc(html) : this.fmt(html))) + '<\u002Fdiv><\u002Fdiv>';\n  }\n\n  renderTutorMessages(n) {\n    const panel = this.modalPanel('tutor');\n    const scroll = panel.querySelector('[data-tutor-scroll]');\n    if (!scroll) return;\n    const msgs = this.chats[n] || [];\n    if (!msgs.length && !this.tutorBusy) {\n      scroll.innerHTML = '<div style=\"margin:auto;text-align:center;max-width:360px;color:#8a8678;\"><p style=\"font-family:\\'Schibsted Grotesk\\';font-weight:700;font-size:16px;color:#16293f;margin:0 0 8px;\">Ask the AI tutor<\u002Fp><p style=\"margin:0;font-size:14px;line-height:1.6;\">Stuck on a concept from this chapter? Ask for an explanation, a worked example, or a quick recap.<\u002Fp><\u002Fdiv>';\n      return;\n    }\n    let h = '';\n    for (const m of msgs) h += this.bubble(m.role, m.text);\n    if (this.tutorBusy) h += this.bubble('assistant', '<span style=\"opacity:.6;\">Thinking…<\u002Fspan>', true);\n    scroll.innerHTML = h;\n    scroll.scrollTop = scroll.scrollHeight;\n  }\n\n  async sendTutor() {\n    const n = this.current;\n    const panel = this.modalPanel('tutor');\n    const ta = panel.querySelector('[data-tutor-input]');\n    const text = (ta.value || '').trim();\n    if (!text || this.tutorBusy) return;\n    this.chats[n] = this.chats[n] || [];\n    this.chats[n].push({ role: 'user', text });\n    ta.value = ''; ta.style.height = 'auto';\n    this.saveChat(n);\n    if (!this.aiReady()) {\n      this.chats[n].push({ role: 'assistant', text: 'The AI tutor is available when viewing this page in the interactive preview.' });\n      this.renderTutorMessages(n); this.saveChat(n); return;\n    }\n    this.tutorBusy = true; this.renderTutorMessages(n);\n    try {\n      const c = this.ctx(n);\n      const sys = 'You are a friendly, concise tutor for ACCA/FIA Management Accounting (MA2 - Managing Costs and Finances), specifically \"Chapter ' + n + ': ' + c.title + '\" (topics: ' + c.topics.join('; ') + '). Explain clearly with short paragraphs and worked steps where useful. Keep answers under 180 words. If asked something unrelated, answer briefly then steer back to the chapter.';\n      const messages = [{ role: 'user', content: sys }, { role: 'assistant', content: 'Understood - I will help with this chapter. What would you like to know?' }];\n      for (const m of this.chats[n]) messages.push({ role: m.role, content: m.text });\n      const reply = await window.claude.complete({ messages });\n      this.chats[n].push({ role: 'assistant', text: reply || '(no response)' });\n    } catch (e) {\n      this.chats[n].push({ role: 'assistant', text: 'Sorry - I had trouble responding. Please try again.' });\n    }\n    this.tutorBusy = false; this.saveChat(n); this.renderTutorMessages(n);\n  }\n\n  loadProgress() { try { this.studied = JSON.parse(localStorage.getItem('ma2-study-progress-v1')) || {}; } catch (e) { this.studied = {}; } }\n  saveProgress() { try { localStorage.setItem('ma2-study-progress-v1', JSON.stringify(this.studied)); } catch (e) {} }\n\n  paintFilter() {\n    if (!this.rootEl) return;\n    let anyVisible = false;\n    this.rootEl.querySelectorAll('[data-chapter]').forEach((c) => {\n      const okPart = this.filter === 'all' || c.getAttribute('data-part') === this.filter;\n      const okQ = !this.query || c.getAttribute('data-search').indexOf(this.query) >= 0;\n      const vis = okPart && okQ;\n      c.style.display = vis ? 'flex' : 'none';\n      if (vis) anyVisible = true;\n    });\n    this.rootEl.querySelectorAll('[data-partblock]').forEach((pb) => {\n      const has = Array.prototype.some.call(pb.querySelectorAll('[data-chapter]'), (c) => c.style.display !== 'none');\n      pb.style.display = has ? '' : 'none';\n    });\n    this.rootEl.querySelectorAll('[data-filter]').forEach((b) => {\n      const active = b.getAttribute('data-filter') === this.filter;\n      b.style.background = active ? '#16293f' : '#fff';\n      b.style.color = active ? '#f5f4ef' : '#16293f';\n      b.style.borderColor = active ? '#16293f' : '#d6d1c4';\n    });\n    const empty = this.rootEl.querySelector('[data-empty]');\n    if (empty) empty.style.display = anyVisible ? 'none' : '';\n  }\n\n  paintStudied() {\n    if (!this.rootEl) return;\n    let count = 0;\n    const toggles = this.rootEl.querySelectorAll('[data-studied-toggle]');\n    toggles.forEach((btn) => {\n      const n = btn.getAttribute('data-studied-toggle');\n      const on = !!this.studied[n];\n      if (on) count++;\n      const card = btn.closest('[data-chapter]');\n      const check = btn.querySelector('[data-check]');\n      const label = btn.querySelector('[data-studied-label]');\n      if (on) {\n        btn.style.background = 'var(--accent-soft)'; btn.style.borderColor = 'var(--accent)'; btn.style.color = 'var(--accent-deep)';\n        if (label) label.textContent = 'Studied';\n        if (check) { check.style.background = 'var(--accent)'; check.style.borderColor = 'var(--accent)'; check.textContent = '✓'; }\n        if (card) card.style.borderColor = 'var(--accent)';\n      } else {\n        btn.style.background = '#fff'; btn.style.borderColor = '#d6d1c4'; btn.style.color = '#6b7480';\n        if (label) label.textContent = 'Mark as studied';\n        if (check) { check.style.background = 'transparent'; check.style.borderColor = '#c2bdae'; check.textContent = ''; }\n        if (card) card.style.borderColor = '#e4e0d6';\n      }\n    });\n    const total = toggles.length;\n    const bar = this.rootEl.querySelector('[data-progress-bar]');\n    if (bar) bar.style.width = (total ? (count / total * 100) : 0) + '%';\n    const cnt = this.rootEl.querySelector('[data-progress-count]');\n    if (cnt) cnt.textContent = count + ' / ' + total + ' chapters';\n  }\n\n  applyTweaks() {\n    if (!this.rootEl) return;\n    this.rootEl.style.setProperty('--accent', this.props.accent || '#b08d4f');\n    const showPages = this.props.showPageNumbers !== false;\n    this.rootEl.querySelectorAll('[data-page]').forEach((el) => { el.style.display = showPages ? '' : 'none'; });\n    const showTopics = this.props.showTopics !== false;\n    this.rootEl.querySelectorAll('[data-topics]').forEach((el) => { el.style.display = showTopics ? '' : 'none'; });\n  }\n\n  paintNav() {\n    if (!this.rootEl) return;\n    this.rootEl.querySelectorAll('[data-nav]').forEach((a) => {\n      const active = a.getAttribute('data-nav') === this.state.activeSection;\n      a.style.color = active ? 'var(--accent-deep)' : '#3a4550';\n      a.style.background = active ? 'rgba(176,141,79,0.12)' : 'transparent';\n    });\n  }\n\n  renderVals() {\n    return { setRoot: (el) => { this.rootEl = el; } };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
